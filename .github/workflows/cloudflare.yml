# =============================================================================
# Cloudflare — configuration de zone (DNS/SSL) pour neden.fr
# -----------------------------------------------------------------------------
# Le déploiement du Worker app.neden.fr (shell COMMAND OS + proxy API) vit
# désormais uniquement dans Neden-application/workers/app-proxy — décision
# du 16/09/2026 (audit du 15/09) : ce dépôt avait son propre worker/, une
# copie obsolète (headers navigateur bruts relayés → 502) qui déployait sur
# le MÊME Worker Cloudflare que Neden-application (même `name = "neden"`,
# même route `app.neden.fr/*`), avec un vrai risque d'écrasement silencieux
# de la prod à chaque push. Supprimé plutôt que synchronisé : entretenir
# deux pipelines de déploiement pour un seul Worker n'apporte rien, et le
# dernier arrivé écrase toujours l'autre. La fonctionnalité PWA (manifest/
# service worker) que ce Worker portait a été reprise dans
# Neden-application/workers/app-proxy/app-proxy.js avant cette suppression.
#
# UN SEUL SECRET À CRÉER : CLOUDFLARE_API_TOKEN, dans
# Settings → Secrets and variables → Actions du dépôt.
# Portées du jeton (Cloudflare → My Profile → API Tokens → Create Token) :
#   Zone   · Zone            · Read    (retrouver l'identifiant de la zone)
#   Zone   · Zone Settings   · Edit    (SSL, HSTS, sécurité)
#   Zone   · DNS             · Edit    (créer app.neden.fr)
# Limiter la ressource à la zone neden.fr : un jeton restreint qui fuite fait
# moins de dégâts qu'un jeton global.
# =============================================================================

name: Cloudflare — zone

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cloudflare-setup.mjs'
      - '.github/workflows/cloudflare.yml'
  # Permet de relancer à la demande depuis l'onglet Actions, sans commit —
  # utile après un changement fait à la main au tableau de bord.
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation (n'écrit rien, affiche ce qui changerait)"
        type: boolean
        default: false

jobs:
  zone:
    name: Réglages de zone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Appliquer la configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: neden.fr
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN absent des secrets du dépôt."
            echo "À créer dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/cloudflare-setup.mjs ${{ inputs.simulation && '--dry-run' || '' }}
