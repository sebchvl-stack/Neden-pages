# =============================================================================
# Cloudflare — configuration de zone neden.fr (site public uniquement)
# -----------------------------------------------------------------------------
# Ce workflow ne déploie PLUS le Worker app.neden.fr.
# Source de vérité app.neden.fr : Neden-application/workers/app-proxy/
# (décision produit 15/09/2026 — option a : retirer le Worker de Neden-pages).
#
# UN SEUL SECRET À CRÉER : CLOUDFLARE_API_TOKEN, dans
# Settings → Secrets and variables → Actions du dépôt.
# Portées du jeton (Cloudflare → My Profile → API Tokens → Create Token) :
#   Zone   · Zone            · Read
#   Zone   · Zone Settings   · Edit
#   Zone   · DNS             · Edit
# Limiter la ressource à la zone neden.fr.
# =============================================================================

name: Cloudflare — zone neden.fr

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cloudflare-setup.mjs'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation (n'écrit rien, affiche ce qui changerait)"
        type: boolean
        default: false

jobs:
  zone:
    name: Réglages de zone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Appliquer la configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: neden.fr
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN absent des secrets du dépôt."
            echo "À créer dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/cloudflare-setup.mjs ${{ inputs.simulation && '--dry-run' || '' }}
